services:
  - type: web
    name: prbuilder
    runtime: node
    plan: free
    rootDir: kaizenq-identity
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PAYMENT_GATEWAY
        value: cashfree
      - key: VITE_CASHFREE_MODE
        value: production
      - key: VITE_CASHFREE_APP_ID
        value: 13056738326c919944b027081033765031
      - key: CASHFREE_APP_ID
        value: 13056738326c919944b027081033765031
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: production
      - key: CASHFREE_API_VERSION
        value: 2023-08-01
